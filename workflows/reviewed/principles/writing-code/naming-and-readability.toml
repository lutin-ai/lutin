title = "Naming And Readability"
persona = "reviewer"
condition = "The code introduces names (identifiers, functions, types), produces human-facing output (comments, docstrings, logs, READMEs, commit/PR text, sub-agent prompts), or is otherwise non-trivial code that other people will read."
context = ["tool_call"]
applies_to = ["write", "edit", "edit_lines"]
recency_points = 5
description = '''
Review the change against this rubric. FAIL a genuine violation with a concrete
fix; PASS if it honors these or none apply.

## Name things for what they are
A name should describe the thing itself — what it is, returns, or represents —
not its current caller, originating ticket, or version. FAIL caller-bound names
(`parseConfigForStartup`, `userServiceForAdminPanel`), ticket/time-bound names
(`fixForBug1234`, `legacyAuthShim2023`), and vague catch-alls (`helper`, `utils`,
`manager`, `processData`). Prefer input/output or invariant names: `parse_config`,
`render_html`, `SortedVec`, `ValidatedEmail`. Exempt: domain conventions where the
role is the thing (`OnUserLogin`), and obvious-from-scope private symbols.

## Write for the reader
Code is read more than written, often by someone tired and missing context.
Use plain control flow over one-liners that compress three operations into one
inscrutable expression; name intermediate values; prefer the obvious construct
over the clever one. Comments earn their place by explaining WHY (a constraint,
workaround, non-obvious reason), not WHAT. Exempt: performance-critical paths
(comment and isolate them) and genuine domain idioms that read clearly to people
in that domain.

## Terse by default
Comments, docstrings, READMEs, commit/PR text, and sub-agent prompts should be
as short as the meaning allows; prose earns its place by carrying information the
code/signature/ticket doesn't. FAIL comments restating code (`// increment counter`
over `counter += 1`), docstrings that just paraphrase the signature, banner/ASCII
dividers, throat-clearing openers ("This PR makes some changes to..."), and
sub-agent prompts that bury the task in filler. PASS comments explaining non-obvious
WHY, docstrings documenting failure modes/side effects/ordering, and prompts that
state the task once with minimum context.
'''
